<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Your House: Math Architect</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF0;--card:#FBFCFC;--ink:#1B2A41;--mute:#5B6B7C;--line:#C5D0D8;--acc:#E0A526;--accInk:#1B2A41;--ok:#2E8B57;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101820;--card:#1A2530;--ink:#EAF0F4;--mute:#9FB0BF;--line:#33424F;--ok:#5BC68A;--bad:#FF7A6B}}
:root[data-theme="dark"]{--bg:#101820;--card:#1A2530;--ink:#EAF0F4;--mute:#9FB0BF;--line:#33424F;--ok:#5BC68A;--bad:#FF7A6B}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:clamp(26px,5vw,42px);font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(19px,3vw,25px);margin:0 0 12px;font-weight:600}
h3{font-size:15px;margin:14px 0 8px;color:var(--mute);font-weight:600}
p{margin:0 0 12px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
button{font:inherit;cursor:pointer;color:var(--ink)}
input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);color:var(--accInk);border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:17px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 16px;font-size:16px}
.ghost:hover{border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.start{max-width:520px;margin:6vh auto 0}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block;border-radius:10px}
.bar{display:flex;gap:4px;margin:0 0 14px}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar i.d{background:var(--ok)}.bar i.n{background:var(--acc)}
.meta{color:var(--mute);font-size:14px;margin-bottom:6px}
.ans{display:grid;gap:10px}
.ans button{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:17px}
.ans button:hover:not(:disabled){border-color:var(--acc)}
.ans button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.ans button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
.chips button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,var(--card));font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sws button{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sws button.sel{box-shadow:0 0 0 3px var(--acc)}
.msg{font-weight:600;margin:12px 0 0}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.center{text-align:center}
.score{font-size:20px;color:var(--ink);font-weight:600}
.lb{display:grid;gap:10px}
.lbr{display:grid;grid-template-columns:34px 120px 1fr auto;gap:12px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.lbr.me{border-color:var(--acc)}
.rk{font-size:22px;font-weight:800;text-align:center}
.nm{font-weight:600;font-size:18px;word-break:break-word}
@media (max-width:520px){.lbr{grid-template-columns:28px 80px 1fr}.lbr button{grid-column:1/-1}}
.det{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;font-size:15px}
.det span{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px var(--line);flex:none}
@media (prefers-reduced-motion:no-preference){svg g.new{animation:pop .5s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(q){var a=q[1].map(function(t,i){return{t:t,c:i===q[2]}}),i,j,x;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=a[i];a[i]=a[j];a[j]=x}return a}
function hdr(){return '<div class="top"><h1>Build your house</h1><div class="row"><button class="ghost" id="nh">Play</button><button class="ghost" id="nb"'+(OWNER?'':' hidden')+'>Leaderboard</button></div></div>'}
function nav(){var a=document.getElementById("nh"),b=document.getElementById("nb");if(a)a.onclick=home;if(b)b.onclick=board}
function bar(){var h='<div class="bar" aria-label="Progress">',i;for(i=0;i<15;i++)h+='<i class="'+(i<S.built?'d':(i===S.i&&S.ph!=="end"?'n':''))+'"></i>';return h+'</div>'}
function home(){S={ph:"home"};
app.innerHTML=hdr()+'<div class="card start"><h2>Welcome, future architect</h2><p>Answer 15 architecture maths questions. Every right answer lets you design a part of your house: pick a style and a colour and watch it appear. One wrong answer ends the build. Your house is saved when the game ends.</p><label for="nm" class="meta">Your name</label><input id="nm" maxlength="20" autocomplete="given-name" placeholder="Type your name"><button class="primary" id="go">Start building</button></div>';nav();
var i=document.getElementById("nm"),go=function(){var v=i.value.trim();if(!v){i.focus();return}S={name:v,i:0,ch:{},built:0,ph:"q",last:null,gid:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};S.a=shuffle(Q[0]);game()};
document.getElementById("go").onclick=go;i.onkeydown=function(e){if(e.key==="Enter")go()}}
function game(){
var q=Q[S.i],fin=S.ph==="end",pt=PT[S.i]||[],h=hdr()+'<h2>'+esc(S.name)+'’s house</h2>'+bar()+'<div class="grid"><div class="card" id="hs">'+draw(S.ch,fin,S.sel&&S.ph==="pick"?{k:pt[0],s:S.sel.s,c:S.sel.c}:null,S.last)+'</div><div class="card">';
if(S.ph==="q")h+='<div class="meta">Question '+(S.i+1)+' of 15</div><h2>'+esc(q[0])+'</h2><div class="ans">'+S.a.map(function(a,k){return '<button data-k="'+k+'">'+esc(a.t)+'</button>'}).join("")+'</div><div id="fb"></div>';
else if(S.ph==="pick"){var pal=PAL[pt[2]];h+='<div class="meta">Question '+(S.i+1)+' of 15</div><h2>Correct! Design your '+pt[1]+'</h2><h3>Style</h3><div class="chips" id="st">'+pt[3].map(function(n,k){return '<button data-k="'+k+'"'+(k==S.sel.s?' class="sel"':'')+'>'+n+'</button>'}).join("")+'</div><h3>Colour</h3><div class="sws" id="cl">'+pal.map(function(c,k){return '<button data-k="'+k+'" aria-label="Colour '+(k+1)+'" style="background:'+c+'"'+(c==S.sel.c?' class="sel"':'')+'></button>'}).join("")+'</div><p style="margin-top:14px">The preview updates as you choose.</p><button class="primary" id="ok">Build it</button>'}
else{var all=S.built===15;h+='<div class="center"><h2>'+(all?'Master architect, '+esc(S.name)+'!':'Your build has stopped')+'</h2><p class="score">'+S.built+' of 15 parts designed</p><p>'+(all?'Every question right. Your dream house is complete.':'The house stays unfinished, exactly as you left it.')+'</p><p id="sv">Saving your house…</p><div class="row" style="justify-content:center">'+(OWNER?'<button class="primary" id="lb">See leaderboard</button>':'')+'<button class="ghost" id="ag">Build another house</button></div></div>'}
app.innerHTML=h+'</div></div>';nav();bind()}
function bind(){var q=Q[S.i],pt=PT[S.i]||[],e;
if(S.ph==="q")app.querySelectorAll(".ans button").forEach(function(b){b.onclick=function(){answer(+b.dataset.k)}});
if(S.ph==="pick"){var pal=PAL[pt[2]],up=function(){document.getElementById("hs").innerHTML=draw(S.ch,false,{k:pt[0],s:S.sel.s,c:S.sel.c},null);
app.querySelectorAll("#st button").forEach(function(b){b.classList.toggle("sel",+b.dataset.k==S.sel.s)});
app.querySelectorAll("#cl button").forEach(function(b){b.classList.toggle("sel",pal[+b.dataset.k]==S.sel.c)})};
app.querySelectorAll("#st button").forEach(function(b){b.onclick=function(){S.sel.s=+b.dataset.k;up()}});
app.querySelectorAll("#cl button").forEach(function(b){b.onclick=function(){S.sel.c=pal[+b.dataset.k];up()}});
document.getElementById("ok").onclick=place}
if(S.ph==="end"){var lb=document.getElementById("lb");if(lb)lb.onclick=board;document.getElementById("ag").onclick=home;submit()}}
function answer(k){
var bs=app.querySelectorAll(".ans button"),ok=S.a[k].c;
bs.forEach(function(b,j){b.disabled=true;if(S.a[j].c)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
var fb=document.getElementById("fb");
if(ok){fb.innerHTML='<p class="msg ok">Correct!</p>';setTimeout(function(){S.ph="pick";S.sel={s:0,c:PAL[PT[S.i][2]][0]};game()},650)}
else{fb.innerHTML='<p class="msg bad">Not quite. The right answer is highlighted. Your build stops here.</p><button class="primary" id="fin">See my house</button>';document.getElementById("fin").onclick=function(){S.ph="end";S.last=null;game()}}}
function place(){var pt=PT[S.i];S.ch[pt[0]]=[S.sel.s,S.sel.c];S.last=pt[0];S.built++;S.i++;S.sel=null;
if(S.i>=15){S.ph="end";S.last=null}else{S.ph="q";S.a=shuffle(Q[S.i])}
game();window.scrollTo(0,0)}
function submit(){
var e={id:UID||S.gid,name:S.name,built:S.built,at:Date.now(),ch:S.ch},el=function(t){var x=document.getElementById("sv");if(x)x.textContent=t};
LOCAL=LOCAL.filter(function(x){return x.id!==e.id});LOCAL.push(e);
if(!DB){el("Saved for this session only.");return}
var r=DB.collection("scores").doc(e.id);
r.get().then(function(s){if(s.exists&&s.data().built>e.built){el("Your earlier, higher score was kept.");return}
return r.set({name:e.name,built:e.built,at:e.at,chs:JSON.stringify(e.ch)}).then(function(){el("Your house was saved!")})}).catch(function(){el("Couldn’t save to the shared board. Your score is kept for this session.")})}
function getBoard(){
if(!DB)return Promise.resolve({list:LOCAL.slice(),shared:false});
var t=new Promise(function(res){setTimeout(function(){res(null)},10000)});
return Promise.race([DB.collection("scores").get().then(function(sn){return{shared:true,list:sn.docs.map(function(d){var x=d.data(),c={};try{c=JSON.parse(x.chs||"{}")}catch(e){}return{id:d.id,name:x.name||"Player",built:x.built||0,at:x.at||0,ch:c}})}}).catch(function(){return null}),t]).then(function(r){return r||{list:LOCAL.slice(),shared:false}})}
function board(){if(!OWNER){home();return}S.ph="board";
app.innerHTML=hdr()+'<div class="card"><h2>Leaderboard</h2><p>Loading…</p></div>';nav();
getBoard().then(function(r){if(S.ph!=="board")return;
var l=r.list.sort(function(a,b){return b.built-a.built||a.at-b.at}),me=UID||S.gid,h=hdr()+'<div class="card"><h2>Leaderboard</h2>'+(r.shared?'':'<p>Showing this session only. The shared leaderboard isn’t available here.</p>');
if(!l.length)h+='<p>No houses yet. Be the first to build one!</p>';
h+='<div class="lb">'+l.map(function(x,i){return '<div class="lbr'+(x.id===me?' me':'')+'"><div class="rk">'+(i+1)+'</div><div>'+draw(x.ch,true)+'</div><div><div class="nm">'+esc(x.name)+'</div><div class="meta">'+x.built+' of 15 parts designed</div></div><button class="ghost" data-i="'+i+'">View house</button></div>'}).join("")+'</div></div>';
app.innerHTML=h;nav();
app.querySelectorAll(".lbr button").forEach(function(b){b.onclick=function(){show(l[+b.dataset.i])}})})}
function show(x){S.ph="show";
var det=PT.filter(function(p){return x.ch[p[0]]}).map(function(p){var v=x.ch[p[0]];return '<span><i class="dot" style="background:'+esc(v[1])+'"></i>'+p[1]+': '+p[3][v[0]]+'</span>'}).join("");
app.innerHTML=hdr()+'<div class="card"><div class="top"><h2 style="margin:0">'+esc(x.name)+'’s house</h2><button class="ghost" id="bk">Back to leaderboard</button></div><p>'+x.built+' of 15 parts designed</p>'+draw(x.ch,true)+'<h3>Design choices</h3><div class="det">'+(det||'Nothing was built yet.')+'</div></div>';nav();
document.getElementById("bk").onclick=board}
home();
</script>
</body>
</html>
